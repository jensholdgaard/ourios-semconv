groups:
  # Log event names for ourios-server's own (dogfooded) logs — every
  # `tracing` call site carries one of these as its explicit event name
  # (never tracing's default `event <file>:<line>`), so the emitted Logs
  # signal stays registry-backed end to end. `weaver registry live-check`
  # enforces this at emission time.
  - id: event.ourios.server.compaction.disabled
    type: event
    name: ourios.server.compaction.disabled
    stability: development
    brief: >
      Compaction is disabled for this process
      (`OURIOS_COMPACTION_ENABLED` / `compaction.enabled: false`), so a
      dedicated compactor elsewhere is expected to sweep.
  - id: event.ourios.server.signal_handler.error
    type: event
    name: ourios.server.signal_handler.error
    stability: development
    brief: >
      Installing the SIGTERM handler failed; SIGINT remains the shutdown
      path.
  - id: event.ourios.server.auth.open_mode
    type: event
    name: ourios.server.auth.open_mode
    stability: development
    brief: >
      A network role started with no `auth` section configured
      (RFC 0026 §3.1 open mode): the listeners accept unauthenticated
      requests, and any client that can reach them can write into and
      read from any tenant.
  - id: event.ourios.server.tls.plaintext_credentials
    type: event
    name: ourios.server.tls.plaintext_credentials
    stability: development
    brief: >
      Credentials (`auth.tokens` / `auth.oidc`) are configured but a
      listener has no `*_tls` block (RFC 0030 §3.4): bearer tokens
      cross the network in cleartext unless TLS terminates at a
      fronting proxy or mesh.
  - id: event.ourios.compaction.sweep.error
    type: event
    name: ourios.compaction.sweep.error
    stability: development
    brief: >
      A compaction sweep failed or reported per-item errors; the daemon
      continues with the next sweep.
  - id: event.ourios.compaction.erasure.completed
    type: event
    name: ourios.compaction.erasure.completed
    stability: development
    brief: >
      A requested conversation erasure completed: every partition rewrote
      without the rows, the graph tuples are deleted, and the marker is
      removed (RFC 0047 §3.6 / RFC 0048 §3.3). The message names the
      tenant, the conversation, rows dropped and tuples deleted.
  - id: event.ourios.graph.backfill.progress
    type: event
    name: ourios.graph.backfill.progress
    stability: development
    brief: >
      One partition of a `graph backfill` run was read and its derived
      tuples written (RFC 0048 §3.4). The message names the tenant, the
      partition, rows offered and tuples written.
  - id: event.ourios.server.graph.list_deadline
    type: event
    name: ourios.server.graph.list_deadline
    stability: development
    brief: >
      The graph resolver's client-side enumeration timeout and the
      declared server-side OPENFGA_LIST_OBJECTS_DEADLINE, logged once at
      startup (RFC 0048 §3.6) — the server cannot observe the real
      deadline, so it makes its assumption loud; the message carries both
      values in milliseconds.
  - id: event.ourios.querier.shutdown.error
    type: event
    name: ourios.querier.shutdown.error
    stability: development
    brief: >
      The querier role failed to drain cleanly during graceful shutdown.
  - id: event.ourios.receiver.shutdown.error
    type: event
    name: ourios.receiver.shutdown.error
    stability: development
    brief: >
      The receiver role failed to drain cleanly during graceful shutdown.
  - id: event.ourios.receiver.audit_sink.retained
    type: event
    name: ourios.receiver.audit_sink.retained
    stability: development
    brief: >
      The audit sink retained buffered events (store unavailable?); the
      record flush and snapshot are skipped this cycle so a clean row is
      not exposed before its template event is durable. No acknowledged
      data is lost — the WAL is durable.
  - id: event.ourios.receiver.sink.retained
    type: event
    name: ourios.receiver.sink.retained
    stability: development
    brief: >
      The record sink retained buffered records (store unavailable?); the
      snapshot is skipped so recovery re-mines them. No acknowledged data
      is lost — the WAL is durable.
  - id: event.ourios.receiver.snapshot.error
    type: event
    name: ourios.receiver.snapshot.error
    stability: development
    brief: >
      Writing a miner snapshot failed; the next start may replay more
      from the WAL.
  - id: event.ourios.receiver.wal.truncated
    type: event
    name: ourios.receiver.wal.truncated
    stability: development
    brief: >
      The WAL was truncated past a tenant's snapshot high-water mark
      (external mutation); templates first seen in the gap may re-mint —
      drift is observable via the RFC 0010 drift query.
  # RFC 0052 (§3.1 barrier failures, §3.5 transitions). Each transition
  # event is emitted exactly once at the edge it names, by the edge's one
  # owner: rotation edges synchronously by the WAL coordinator, floor and
  # latch edges by the receiver's timer task.
  - id: event.ourios.receiver.wal.checkpoint.error
    type: event
    name: ourios.receiver.wal.checkpoint.error
    stability: development
    brief: >
      The barrier's WAL checkpoint write failed; the previous mark stays
      in force, so nothing past it is reclaimed until a later cut stamps.
      No acknowledged data is lost — the WAL is durable.
    note: >
      `error.type` is `no_reclamation_surface` when the journal exposes no
      checkpoint at all, otherwise the class of the failed write.
    attributes:
      - ref: error.type
        requirement_level: required
  - id: event.ourios.receiver.wal.idle_rotation.error
    type: event
    name: ourios.receiver.wal.idle_rotation.error
    stability: development
    brief: >
      The barrier's discretionary idle rotation failed; the cut proceeds
      against the open segment, which stays unreclaimable until it
      rotates.
    attributes:
      - ref: error.type
        requirement_level: required
  - id: event.ourios.receiver.wal.rotation.retrying
    type: event
    name: ourios.receiver.wal.rotation.retrying
    stability: development
    brief: >
      A WAL rotation failed and entered the retrying state (RFC 0052
      §3.3): the next append retries it within the
      `rotation_retry_attempts` budget.
    note: >
      `error.type` names the rotation step that first failed:
      `close_sync`, `create`, `header_sync`, `rename` or `parent_fsync`
      (the first failure's step, which the budget keeps as the
      diagnosis).
    attributes:
      - ref: error.type
        requirement_level: required
  - id: event.ourios.receiver.wal.rotation.recovered
    type: event
    name: ourios.receiver.wal.rotation.recovered
    stability: development
    brief: >
      A retried WAL rotation succeeded, leaving the retrying state
      (RFC 0052 §3.3).
  - id: event.ourios.receiver.wal.rotation.terminal
    type: event
    name: ourios.receiver.wal.rotation.terminal
    stability: development
    brief: >
      The WAL rotation retry budget is spent and the rotation state is
      terminal (RFC 0052 §3.3): appends are refused until a restart.
      There is no matching leave event — the only exit is a restart,
      which a fresh WAL cannot observe.
    note: >
      `error.type` names the rotation step whose failure exhausted the
      budget, as on `ourios.receiver.wal.rotation.retrying`.
    attributes:
      - ref: error.type
        requirement_level: required
  - id: event.ourios.receiver.wal.retain_floor.pinned
    type: event
    name: ourios.receiver.wal.retain_floor.pinned
    stability: development
    brief: >
      The WAL's retain floor became pinned (RFC 0052 §3.2): a tenant has
      no valid snapshot, so reclamation holds its oldest surviving frame.
  - id: event.ourios.receiver.wal.retain_floor.lifted
    type: event
    name: ourios.receiver.wal.retain_floor.lifted
    stability: development
    brief: >
      The WAL's retain floor is no longer pinned (RFC 0052 §3.2): every
      tenant again has a valid snapshot horizon.
  - id: event.ourios.receiver.barrier.latched
    type: event
    name: ourios.receiver.barrier.latched
    stability: development
    brief: >
      The barrier's `cadence_failed` latch was set (RFC 0052 §3.1): a
      publish or a barrier step unwound, every cut at or above the failed
      epoch is refused, and nothing stamps or reclaims until a restart,
      which replays the WAL. The message names the failed epoch.
  - id: event.ourios.receiver.wal.housekeeping.error
    type: event
    name: ourios.receiver.wal.housekeeping.error
    stability: development
    brief: >
      A WAL housekeeping pass failed or panicked (RFC 0052 §3.2): nothing
      past the pass's bound was unlinked, the checkpoint is untouched, and
      the next pass retries — re-planning whatever an unwound pass left
      uncommitted.
    note: >
      `error.type` is `cadence_panic` for an unwound pass (the value the
      `ourios.sink.flush.errors` counter records for it), otherwise the
      class of the returned reclamation error.
    attributes:
      - ref: error.type
        requirement_level: required
  - id: event.ourios.receiver.cadence.join.error
    type: event
    name: ourios.receiver.cadence.join.error
    stability: development
    brief: >
      A cadence task (the barrier or the housekeeping timer) did not join
      cleanly at shutdown (RFC 0052 §3.2). Read as a failed cut: the
      latch takes the current epoch, nothing is stamped, and the WAL
      replays the uncovered frames on the next start. The message names
      the task.
    note: >
      `error.type` is `panic` or `cancelled`, from the join error.
    attributes:
      - ref: error.type
        requirement_level: required
  - id: event.ourios.receiver.publish.held
    type: event
    name: ourios.receiver.publish.held
    stability: development
    brief: >
      A drain's records were held back and requeued because an earlier
      drain's template events are not durable yet, so records never
      publish ahead of their templates; the drain that carries both
      publishes them.
      Not a failure — no acknowledged data is lost.
    attributes:
      - ref: ourios.sink.flush.trigger
        requirement_level: recommended
  # Listener lifecycle (ourios-serving; RFC 0030 TLS listeners, #791's
  # listener deadlines).
  - id: event.ourios.server.listener.accept.error
    type: event
    name: ourios.server.listener.accept.error
    stability: development
    brief: >
      Accepting a connection failed. A connection-level error (the peer
      went away between SYN and accept) is retried at once; running out
      of file descriptors, or any other error, backs the listener off
      before the next accept.
    note: >
      `error.type` is `fd_exhausted` for `EMFILE`/`ENFILE`,
      `connection_refused`, `connection_aborted` or `connection_reset`
      for the connection-level errors, and `_OTHER` otherwise.
    attributes:
      - ref: error.type
        requirement_level: required
      - ref: ourios.server.listener.name
        requirement_level: required
  - id: event.ourios.server.listener.connection.error
    type: event
    name: ourios.server.listener.connection.error
    stability: development
    brief: >
      An accepted HTTP connection ended with an error (a stalled or idle
      peer cut off by the transport deadlines, a malformed request, a
      reset) rather than a clean close.
    note: >
      `error.type` is `timeout`, `incomplete_message` or `_OTHER`.
    attributes:
      - ref: error.type
        requirement_level: required
      - ref: ourios.server.listener.name
        requirement_level: required
  - id: event.ourios.server.tls.reload.completed
    type: event
    name: ourios.server.tls.reload.completed
    stability: development
    brief: >
      A TLS listener reloaded its certificate from disk after the
      material changed (RFC 0030); new handshakes use it.
    attributes:
      - ref: ourios.server.listener.name
        requirement_level: required
  - id: event.ourios.server.tls.reload.error
    type: event
    name: ourios.server.tls.reload.error
    stability: development
    brief: >
      A TLS certificate reload failed (RFC 0030); the listener keeps
      serving the last good certificate and the next tick retries. The
      message names the certificate, key and client-CA paths.
    note: >
      `error.type` is `unreadable` or `invalid` (the
      `ourios.tls.reload_error` values the
      `ourios.receiver.tls.reload_failures` counter records), or `panic`
      when the reload task itself unwound.
    attributes:
      - ref: error.type
        requirement_level: required
      - ref: ourios.server.listener.name
        requirement_level: required
  - id: event.ourios.receiver.tenant.divergence
    type: event
    name: ourios.receiver.tenant.divergence
    stability: development
    deprecated:
      reason: obsoleted
      note: >-
        The RFC 0045 divergence detector was removed by RFC 0046 (tenancy is
        out of band). Never emitted by a released version.
    brief: >
      A tenant spans more than one value of a watched resource attribute
      (RFC 0045 §3.4): the first observed value and the divergent one are
      attached, bounded. Rate-limited per (tenant, key). Not a rejection.
    attributes:
      - ref: ourios.tenant
        requirement_level: required
      - ref: ourios.tenant.watch.key
        requirement_level: required
      - ref: ourios.tenant.watch.first_value
        requirement_level: required
      - ref: ourios.tenant.watch.value
        requirement_level: required
  - id: event.ourios.receiver.tenant.watch_saturated
    type: event
    name: ourios.receiver.tenant.watch_saturated
    stability: development
    deprecated:
      reason: obsoleted
      note: >-
        The RFC 0045 divergence detector was removed by RFC 0046 (tenancy is
        out of band). Never emitted by a released version.
    brief: >
      The tenant divergence watch reached `receiver.tenant.watch_capacity`;
      further (tenant, key) pairs are not watched. Emitted once per process.
